PACKAGE_NAME="ms912x-ng"
_ms912x_ng_source_dir="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
if git -C "$_ms912x_ng_source_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
	_ms912x_ng_revision="$(git -C "$_ms912x_ng_source_dir" rev-list --count HEAD)"
	_ms912x_ng_commit="$(git -C "$_ms912x_ng_source_dir" rev-parse --short=7 HEAD)"
	PACKAGE_VERSION="r${_ms912x_ng_revision}.${_ms912x_ng_commit}"
	if [[ -n "$(git -C "$_ms912x_ng_source_dir" status --porcelain)" ]]; then
		PACKAGE_VERSION="${PACKAGE_VERSION}.dirty"
	fi
else
	IFS= read -r PACKAGE_VERSION < "$_ms912x_ng_source_dir/VERSION"
fi
unset _ms912x_ng_source_dir _ms912x_ng_revision _ms912x_ng_commit

CLEAN="make KVER=$kernelver KSRC='${kernel_source_dir:-/lib/modules/$kernelver/build}' clean"
MAKE[0]="make KVER=$kernelver KSRC='${kernel_source_dir:-/lib/modules/$kernelver/build}' all"
BUILT_MODULE_NAME[0]="ms912x"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/"
AUTOINSTALL="yes"
