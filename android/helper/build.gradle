plugins { id 'com.android.library' }
android {
    namespace 'io.github.ms912x.helper'
    compileSdk 36
    ndkVersion '30.0.16248370'
    defaultConfig { minSdk 30 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies { implementation project(':ipc') }

def nativeInput = tasks.register('buildNativeInput') {
    inputs.file('src/main/cpp/mouse_input.c')
    outputs.dir(layout.buildDirectory.dir('generated/nativeInput'))
    doLast {
        def host = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        ['aarch64':'arm64-v8a', 'x86_64':'x86_64'].each { arch, abi ->
            def output = layout.buildDirectory.dir("generated/nativeInput/native/${abi}").get().asFile
            output.mkdirs()
            exec {
                commandLine new File(android.ndkDirectory, "toolchains/llvm/prebuilt/${host}/bin/${arch}-linux-android30-clang"),
                        '-std=c11', '-D_GNU_SOURCE', '-shared', '-fPIC', '-O2', '-Wall', '-Wextra', '-Werror',
                        file('src/main/cpp/mouse_input.c'), '-o', new File(output, 'libms912x_input.so')
            }
        }
    }
}

def classesJar = tasks.register('helperClassesJar', Jar) {
    dependsOn 'compileDebugJavaWithJavac', ':ipc:compileDebugJavaWithJavac'
    from layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')
    from project(':ipc').layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')
    archiveFileName = 'helper-classes.jar'
    destinationDirectory = layout.buildDirectory.dir('generated')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def dex = tasks.register('dexHelper', Exec) {
    dependsOn classesJar
    inputs.file(classesJar.flatMap { it.archiveFile })
    outputs.dir(layout.buildDirectory.dir('generated/dex'))
    doFirst {
        def output = layout.buildDirectory.dir('generated/dex').get().asFile
        delete output
        output.mkdirs()
        commandLine new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/d8"),
                '--min-api', '30', '--lib', android.bootClasspath.first(),
                '--output', output, classesJar.get().archiveFile.get().asFile
    }
}
tasks.register('assembleDexJar', Zip) {
    dependsOn dex, nativeInput
    from layout.buildDirectory.dir('generated/dex')
    from layout.buildDirectory.dir('generated/nativeInput')
    archiveFileName = 'helper.jar'
    destinationDirectory = layout.buildDirectory.dir('outputs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
