plugins {
    id 'com.android.application'
}

def mirrorOnly = providers.gradleProperty("mirrorOnly").map { it.toBoolean() }.getOrElse(false)

android {
    buildFeatures { buildConfig true }
    namespace 'io.github.taglia_ti.ms912x_ng.desktop'
    compileSdk 36
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'io.github.taglia_ti.ms912x_ng.desktop'
        minSdk (mirrorOnly ? 24 : 30)
        buildConfigField "boolean", "MIRROR_ONLY", mirrorOnly.toString()
        manifestPlaceholders = [appLabel: mirrorOnly ? "MS912x Mirror" : "MS912x Desktop"]
        if (mirrorOnly) {
            applicationIdSuffix ".mirror"
            versionNameSuffix "-mirror"
        }
        targetSdk 36
        versionCode 11
        versionName rootProject.file('../VERSION').text.trim()
        testInstrumentationRunner 'io.github.taglia_ti.ms912x_ng.desktop.CaptureNativeTestRunner'

        ndk {
            if (mirrorOnly) abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            else abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                arguments "-DMS912X_MIRROR_ONLY=${mirrorOnly ? 'ON' : 'OFF'}"
                cppFlags '-std=c11 -Wall -Wextra -Werror'
            }
        }
    }

    sourceSets {
        main {
            java.srcDir mirrorOnly ? 'src/mirror/java' : 'src/desktop/java'
            if (!mirrorOnly) {
                assets.srcDir layout.buildDirectory.dir('generated/helperAssets')
                assets.srcDir 'src/desktop/assets'
            }
        }
    }

    if (!mirrorOnly) {
        sourceSets.androidTest.java.srcDir 'src/desktopAndroidTest/java'
        sourceSets.debug.manifest.srcFile 'src/desktop/AndroidManifest.xml'
        sourceSets.release.manifest.srcFile 'src/desktop/AndroidManifest.xml'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

if (!mirrorOnly) {
    dependencies { implementation project(':ipc') }
    def helperAsset = tasks.register('generateHelperAssets') {
        dependsOn ':helper:assembleDexJar'
        def helper = project(':helper').layout.buildDirectory.file('outputs/helper.jar')
        inputs.file(helper)
        outputs.dir(layout.buildDirectory.dir('generated/helperAssets'))
        doLast {
            def directory = layout.buildDirectory.dir('generated/helperAssets').get().asFile
            directory.mkdirs()
            def bytes = helper.get().asFile.bytes
            new File(directory, 'helper.jar').bytes = bytes
            new File(directory, 'helper.sha256').text =
                    java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() + '\n'
        }
    }
    tasks.named('preBuild').configure { dependsOn helperAsset }
}
