plugins {
    id 'com.android.application'
}

def mirrorOnly = providers.gradleProperty("mirrorOnly").map { it.toBoolean() }.getOrElse(false)

android {
    buildFeatures { buildConfig true }
    namespace 'io.github.ms912x.desktop'
    compileSdk 36
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'io.github.ms912x.desktop'
        minSdk (mirrorOnly ? 24 : 30)
        buildConfigField "boolean", "MIRROR_ONLY", mirrorOnly.toString()
        manifestPlaceholders = [appLabel: mirrorOnly ? "MS912x Mirror" : "MS912x Desktop"]
        if (mirrorOnly) {
            applicationIdSuffix ".mirror"
            versionNameSuffix "-mirror"
        }
        targetSdk 36
        versionCode 10
        versionName '0.10.0-linux-core'
        testInstrumentationRunner 'io.github.ms912x.desktop.CaptureNativeTestRunner'

        ndk {
            if (mirrorOnly) abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            else abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                cppFlags '-std=c11 -Wall -Wextra -Werror'
            }
        }
    }

    sourceSets {
        main {
            if (!mirrorOnly) jniLibs.srcDir layout.buildDirectory.dir('generated/rustJniLibs')
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register('buildRustAdbBridge') {
    inputs.files(fileTree('../adb-rs') { exclude 'target/**' })
    outputs.dir(layout.buildDirectory.dir('generated/rustJniLibs'))

    doLast {
        def cargo = System.getenv('CARGO') ?: 'cargo'
        def ndkHost = System.getProperty('os.name').toLowerCase().contains('mac')
                ? 'darwin-x86_64' : 'linux-x86_64'
        def clangDir = new File(android.ndkDirectory,
                "toolchains/llvm/prebuilt/${ndkHost}/bin")
        def targets = [
                'aarch64-linux-android': 'arm64-v8a',
                'x86_64-linux-android': 'x86_64'
        ]
        targets.each { target, abi ->
            def compilerName = target.startsWith('aarch64')
                    ? 'aarch64-linux-android24-clang' : 'x86_64-linux-android24-clang'
            def clang = new File(clangDir, compilerName)
            if (!clang.isFile()) {
                throw new GradleException("Android NDK compiler not found: ${clang}")
            }
            def targetKey = target.replace('-', '_')
            exec {
                workingDir file('../adb-rs')
                environment 'CARGO_TARGET_DIR', layout.buildDirectory.dir('rustTarget').get().asFile
                environment "CC_${targetKey}", clang.absolutePath
                environment "CARGO_TARGET_${targetKey.toUpperCase()}_LINKER", clang.absolutePath
                commandLine cargo, 'build', '--release', '--locked',
                        '--manifest-path', 'Cargo.toml', '--target', target
            }
            copy {
                from layout.buildDirectory.file(
                        "rustTarget/${target}/release/libms912x_adb_bridge.so")
                into layout.buildDirectory.dir("generated/rustJniLibs/${abi}")
            }
        }
    }
}

tasks.named('preBuild').configure {
    if (!mirrorOnly) dependsOn tasks.named('buildRustAdbBridge')
}
