[package]
name = "ms912x-adb-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
publish = false

[lib]
name = "ms912x_adb_bridge"
crate-type = ["cdylib"]

[dependencies]
droidmux = { git = "https://github.com/poapoauu/DroidMux", rev = "9adeb6258166e9b88808bc6e67845c73763f070c", default-features = false, features = ["pairing", "shell", "sync"] }
async-trait = "0.1.92"
jni = "0.21.1"
secrecy = "0.10.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
